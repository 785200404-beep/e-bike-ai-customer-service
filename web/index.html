<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>首驱电动车智能客服</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #f6f7f9; color: #333; display: flex; flex-direction: column; height: 100%;
  }
  /* —— 头部：品牌渐变 + 圆角 + 阴影 —— */
  header {
    background: linear-gradient(135deg, #ff8a3d 0%, #ff5a1f 55%, #e8460a 100%);
    color: #fff; padding: 20px 16px 18px; text-align: center; flex-shrink: 0;
    border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
    box-shadow: 0 4px 14px rgba(255, 90, 31, .28);
  }
  header .logo { font-size: 19px; font-weight: 700; letter-spacing: 1px; }
  header .logo .logo-ico {
    display: inline-block; width: 32px; height: 32px; line-height: 32px; border-radius: 50%;
    background: rgba(255, 255, 255, .22); margin-right: 9px; font-size: 18px; vertical-align: -5px;
  }
  header small { display: block; font-size: 11px; font-weight: 400; opacity: .92; margin-top: 5px; letter-spacing: .5px; }
  /* —— 聊天区 —— */
  #chat { flex: 1; overflow-y: auto; padding: 16px 14px 8px; -webkit-overflow-scrolling: touch; }
  .msg { display: flex; margin-bottom: 18px; align-items: flex-end; }
  .msg .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; font-size: 19px;
    display: flex; align-items: center; justify-content: center;
  }
  .msg.bot .avatar { background: linear-gradient(135deg, #ff8a3d, #ff4d00); box-shadow: 0 2px 6px rgba(255, 90, 31, .3); }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: #e4e8ed; }
  .msg .body { max-width: 76%; margin: 0 10px; min-width: 0; }
  .msg .bubble {
    padding: 10px 14px; border-radius: 16px; line-height: 1.55; font-size: 15px;
    word-break: break-word; white-space: pre-wrap; position: relative;
  }
  .msg.bot .bubble { background: #fff; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(0, 0, 0, .05); }
  .msg.bot .bubble::before {
    content: ''; position: absolute; left: -7px; bottom: 10px;
    border: 7px solid transparent; border-right-color: #fff; border-left-width: 0;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, #ff8a3d, #ff5a1f); color: #fff;
    border-bottom-right-radius: 4px; box-shadow: 0 2px 8px rgba(255, 90, 31, .25);
  }
  .msg.user .bubble::before {
    content: ''; position: absolute; right: -7px; bottom: 10px;
    border: 7px solid transparent; border-left-color: #ff5a1f; border-right-width: 0;
  }
  .bubble.welcome {
    background: #fff7f2; border: 1px dashed #ffb38a; color: #8a4a26;
    border-bottom-left-radius: 16px;
  }
  .msg .time { font-size: 10px; color: #b6bcc4; margin-top: 4px; padding: 0 2px; }
  .msg.user .time { text-align: right; }
  .msg .tools { font-size: 11px; color: #999; margin-top: 4px; }
  /* —— 打字中：三个跳动圆点 —— */
  .typing .bubble { display: flex; align-items: center; }
  .typing .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #ff8a3d;
    animation: bounce 1.2s infinite; margin-right: 5px;
  }
  .typing .dot:nth-child(2) { animation-delay: .15s; }
  .typing .dot:nth-child(3) { animation-delay: .3s; margin-right: 0; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); opacity: .4; } 50% { transform: translateY(-4px); opacity: 1; } }
  /* —— 快捷对比按钮 —— */
  .chips {
    flex-shrink: 0; display: flex; gap: 8px; padding: 10px 12px; background: #fff;
    border-top: 1px solid #f0f0f0; overflow-x: auto;
  }
  .chips button {
    flex-shrink: 0; border: 1px solid #ffd9c4; background: #fff7f2; color: #e04e12;
    border-radius: 18px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  .chips button:active { background: #ffe4d8; }
  /* —— 输入条 —— */
  footer {
    flex-shrink: 0; display: flex; gap: 8px; padding: 10px 12px; background: #fff;
    border-top: 1px solid #eee; padding-bottom: calc(10px + env(safe-area-inset-bottom));
  }
  #input {
    flex: 1; border: 1px solid #e6e6e6; border-radius: 22px; padding: 11px 16px; font-size: 15px;
    outline: none; background: #f6f7f9; transition: border-color .2s, background .2s;
  }
  #input:focus { border-color: #ff5a1f; background: #fff; }
  #send {
    border: none; background: linear-gradient(135deg, #ff8a3d, #ff5a1f); color: #fff; border-radius: 22px;
    padding: 0 22px; font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 2px 8px rgba(255, 90, 31, .3);
  }
  #send:disabled { opacity: .45; box-shadow: none; }
  /* —— 欢迎卡片 —— */
  .welcome-card {
    margin: 2px 2px 16px; padding: 12px 14px; background: #fff; border-radius: 14px;
    border: 1px solid #ffe3d2; box-shadow: 0 1px 4px rgba(0, 0, 0, .04);
    font-size: 13px; color: #6b4a34; line-height: 1.7;
  }
  .welcome-card b { color: #e04e12; }
</style>
</head>
<body>
<header>
  <div class="logo"><span class="logo-ico">🛵</span>首驱电动车店 · 智能客服</div>
  <small>价格 · 续航 · 库存 · 算账 · 售后 · 竞品对比</small>
</header>
<div id="chat">
  <div class="welcome-card">
    <b>首驱南宁一网门店</b> ｜ 每天 9:00-21:00 周末不休<br>
    以旧换新：旧车抵 <b>300-800 元</b> ｜ 代办上牌 <b>50 元</b><br>
    可问价格、续航、库存、算账、售后，还能对比雅迪 / 小牛 / 九号 / 极核
  </div>
</div>
<div class="chips">
  <button data-q="雅迪和首驱哪个好？">⚡ 和雅迪比</button>
  <button data-q="九号和首驱怎么选？">⚡ 和九号比</button>
  <button data-q="首驱电动车有什么卖点？">💡 首驱卖点</button>
  <button data-q="首驱S300和九号E300P比哪个强？">🏆 旗舰对比</button>
</div>
<footer>
  <input id="input" type="text" placeholder="比如：首驱 Sz110 多少钱？" autocomplete="off">
  <button id="send" disabled>发送</button>
</footer>

<script>
(function () {
  var SID_KEY = 'cs_session_id';
  var chat = document.getElementById('chat');
  var input = document.getElementById('input');
  var send = document.getElementById('send');
  var busy = false;

  function getSessionId() {
    var sid = localStorage.getItem(SID_KEY);
    if (!sid) {
      sid = Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
      localStorage.setItem(SID_KEY, sid);
    }
    return sid;
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function nowTime() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  function addMsg(role, text, tools) {
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    var av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = role === 'user' ? '👤' : '🛵';
    var body = document.createElement('div');
    body.className = 'body';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    body.appendChild(bubble);
    if (tools && tools.length) {
      var t = document.createElement('div');
      t.className = 'tools';
      t.textContent = '（已用工具：' + tools.map(function (x) {
        return x.indexOf('计算器') >= 0 ? '🧮 算账' : '📦 查库存';
      }).join('、') + '）';
      body.appendChild(t);
    }
    var time = document.createElement('div');
    time.className = 'time';
    time.textContent = nowTime();
    body.appendChild(time);
    wrap.appendChild(av);
    wrap.appendChild(body);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function botTyping(on) {
    var t = document.getElementById('typing');
    if (on) {
      if (!t) {
        t = document.createElement('div');
        t.id = 'typing'; t.className = 'msg bot typing';
        var av = document.createElement('div');
        av.className = 'avatar'; av.textContent = '🛵';
        var body = document.createElement('div');
        body.className = 'body';
        var b = document.createElement('div');
        b.className = 'bubble';
        b.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
        body.appendChild(b);
        t.appendChild(av);
        t.appendChild(body);
        chat.appendChild(t);
      }
    } else if (t) { t.remove(); }
    chat.scrollTop = chat.scrollHeight;
  }

  function ask(q) {
    busy = true; send.disabled = true;
    addMsg('user', q);
    botTyping(true);
    fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, session_id: getSessionId() })
    }).then(function (r) { return r.json(); }).then(function (d) {
      var a = d.answer || '';
      if (!a) a = '（服务返回异常，请稍后再试）';
      addMsg('bot', a, d.used_tools || []);
    }).catch(function () {
      addMsg('bot', '连不上后端。请确认 server.py 正在运行（python server.py）。');
    }).finally(function () {
      botTyping(false); busy = false; send.disabled = false; input.focus();
    });
  }

  send.addEventListener('click', function () {
    var q = input.value.trim();
    if (!q || busy) return;
    input.value = '';
    ask(q);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send.click(); }
  });
  input.addEventListener('input', function () {
    send.disabled = busy || !input.value.trim();
  });

  // 快捷对比按钮：点一下直接发问（对比竞品 / 首驱卖点）
  var chips = document.querySelector('.chips');
  chips.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn || busy) return;
    var q = btn.getAttribute('data-q');
    if (q) { input.value = ''; ask(q); }
  });

  input.focus();
})();
</script>
</body>
</html>
