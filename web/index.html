<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>首驱电动车智能客服</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #f6f7f9; color: #333; display: flex; flex-direction: column; height: 100%;
  }
  /* —— 头部：品牌渐变 + 圆角 + 阴影 —— */
  header {
    background: linear-gradient(135deg, #ff8a3d 0%, #ff5a1f 55%, #e8460a 100%);
    color: #fff; padding: 22px 16px; text-align: center; flex-shrink: 0;
    border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
    box-shadow: 0 4px 14px rgba(255, 90, 31, .28);
  }
  header .logo { font-size: 19px; font-weight: 700; letter-spacing: 1px; }
  header .logo .logo-ico {
    display: inline-block; width: 32px; height: 32px; line-height: 32px; border-radius: 50%;
    background: rgba(255, 255, 255, .22); margin-right: 9px; font-size: 18px; vertical-align: -5px;
  }
  /* —— 聊天区 —— */
  #chat { flex: 1; overflow-y: auto; padding: 16px 14px 8px; -webkit-overflow-scrolling: touch; }
  .msg { display: flex; margin-bottom: 18px; align-items: flex-end; }
  .msg .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; font-size: 19px;
    display: flex; align-items: center; justify-content: center;
  }
  .msg.bot .avatar { background: linear-gradient(135deg, #ff8a3d, #ff4d00); box-shadow: 0 2px 6px rgba(255, 90, 31, .3); }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: #e4e8ed; }
  .msg .body { max-width: 76%; margin: 0 10px; min-width: 0; }
  .msg .bubble {
    padding: 10px 14px; border-radius: 16px; line-height: 1.55; font-size: 15px;
    word-break: break-word; white-space: pre-wrap; position: relative;
  }
  .msg.bot .bubble { background: #fff; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(0, 0, 0, .05); }
  .msg.bot .bubble::before {
    content: ''; position: absolute; left: -7px; bottom: 10px;
    border: 7px solid transparent; border-right-color: #fff; border-left-width: 0;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, #ff8a3d, #ff5a1f); color: #fff;
    border-bottom-right-radius: 4px; box-shadow: 0 2px 8px rgba(255, 90, 31, .25);
  }
  .msg.user .bubble::before {
    content: ''; position: absolute; right: -7px; bottom: 10px;
    border: 7px solid transparent; border-left-color: #ff5a1f; border-right-width: 0;
  }
  .bubble.welcome {
    background: #fff7f2; border: 1px dashed #ffb38a; color: #8a4a26;
    border-bottom-left-radius: 16px;
  }
  .msg .time { font-size: 10px; color: #b6bcc4; margin-top: 4px; padding: 0 2px; }
  .msg.user .time { text-align: right; }
  .msg .tools { font-size: 11px; color: #999; margin-top: 4px; }
  /* —— 聊天气泡下的地图导航链接 —— */
  .map-links { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .map-link {
    display: inline-block; border-radius: 14px; padding: 6px 12px; font-size: 12px;
    text-decoration: none; font-weight: 600;
  }
  .map-link.amap { background: #e8f3ff; color: #1a73e8; border: 1px solid #b6d4f0; }
  .map-link.qq { background: #e6f7ee; color: #0aa858; border: 1px solid #b3e6cd; }
  /* —— 打字中：三个跳动圆点 —— */
  .typing .bubble { display: flex; align-items: center; }
  .typing .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #ff8a3d;
    animation: bounce 1.2s infinite; margin-right: 5px;
  }
  .typing .dot:nth-child(2) { animation-delay: .15s; }
  .typing .dot:nth-child(3) { animation-delay: .3s; margin-right: 0; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); opacity: .4; } 50% { transform: translateY(-4px); opacity: 1; } }
  /* —— 快捷对比按钮 —— */
  .chips {
    flex-shrink: 0; display: flex; gap: 8px; padding: 10px 12px; background: #fff;
    border-top: 1px solid #f0f0f0; overflow-x: auto;
  }
  .chips button {
    flex-shrink: 0; border: 1px solid #ffd9c4; background: #fff7f2; color: #e04e12;
    border-radius: 18px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  .chips button:active { background: #ffe4d8; }
  /* —— 输入条 —— */
  footer {
    flex-shrink: 0; display: flex; gap: 8px; padding: 10px 12px; background: #fff;
    border-top: 1px solid #eee; padding-bottom: calc(10px + env(safe-area-inset-bottom));
  }
  #input {
    flex: 1; border: 1px solid #e6e6e6; border-radius: 22px; padding: 11px 16px; font-size: 15px;
    outline: none; background: #f6f7f9; transition: border-color .2s, background .2s;
  }
  #input:focus { border-color: #ff5a1f; background: #fff; }
  #send {
    border: none; background: linear-gradient(135deg, #ff8a3d, #ff5a1f); color: #fff; border-radius: 22px;
    padding: 0 22px; font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 2px 8px rgba(255, 90, 31, .3);
  }
  #send:disabled { opacity: .45; box-shadow: none; }
  /* —— 欢迎卡片 —— */
  .welcome-card {
    margin: 2px 2px 16px; padding: 12px 14px; background: #fff; border-radius: 14px;
    border: 1px solid #ffe3d2; box-shadow: 0 1px 4px rgba(0, 0, 0, .04);
    font-size: 13px; color: #6b4a34; line-height: 1.7;
  }
  .welcome-card b { color: #e04e12; }
  /* —— 门店 / 留资弹层 —— */
  .overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: none;
    align-items: center; justify-content: center; z-index: 10; padding: 20px;
  }
  .overlay .sheet {
    background: #fff; border-radius: 16px; width: 100%; max-width: 340px; padding: 20px 18px;
  }
  .sheet-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .sheet-line { font-size: 14px; color: #555; margin-bottom: 8px; line-height: 1.5; }
  .sheet-input {
    width: 100%; border: 1px solid #ddd; border-radius: 12px; padding: 11px 13px;
    font-size: 15px; margin-bottom: 10px;
  }
  .sheet-input:focus { outline: none; border-color: #ff5a1f; }
  .sheet-btns { display: flex; gap: 8px; margin-top: 14px; }
  .sheet-btn {
    flex: 1; border: 1px solid #ffd9c4; border-radius: 12px; padding: 11px; font-size: 14px; cursor: pointer;
    background: #fff; color: #e04e12;
  }
  .sheet-btn.primary {
    background: linear-gradient(135deg, #ff8a3d, #ff5a1f); color: #fff; border: none;
    box-shadow: 0 2px 6px rgba(255, 90, 31, .3);
  }
  .sheet-close { text-align: center; color: #999; font-size: 13px; margin-top: 12px; cursor: pointer; }
  .overlay .sheet.store-sheet { max-height: 78vh; display: flex; flex-direction: column; }
  .store-list { flex: 1; overflow-y: auto; max-height: 60vh; }
  .store-item { border-bottom: 1px solid #f2f2f2; padding: 10px 2px 12px; }
  .store-item:last-child { border-bottom: none; }
  .store-item .st-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: #333; }
  .store-item .st-line { font-size: 13px; color: #555; line-height: 1.5; margin-bottom: 3px; }
  .store-item .sheet-btns { margin-top: 8px; }
</style>
</head>
<body>
<header>
  <div class="logo"><span class="logo-ico">🛵</span>首驱电动车店 · 智能客服</div>
</header>
<div id="chat">
  <div class="welcome-card">
    <b>首驱南宁一网门店</b> ｜ 每天 9:00-21:00 周末不休<br>
    以旧换新：旧车抵 <b>300-800 元</b> ｜ 上牌不收费，只收牌照邮递费 <b>15 元</b><br>
    可问价格、续航、库存、算账、售后、跑外卖选车，还能对比雅迪 / 小牛 / 九号 / 极核
  </div>
</div>
<div class="chips">
  <button data-q="雅迪和首驱哪个好？">⚡ 和雅迪比</button>
  <button data-q="九号和首驱怎么选？">⚡ 和九号比</button>
  <button data-q="首驱电动车有什么卖点？">💡 首驱卖点</button>
  <button data-q="跑外卖选什么车？">🛵 跑外卖选车</button>
  <button data-q="首驱S300和九号E300P比哪个强？">🏆 旗舰对比</button>
  <button data-action="store">🏪 到店</button>
  <button data-action="lead">📱 预约看车</button>
</div>
<footer>
  <input id="input" type="text" placeholder="比如：首驱 Sz110 多少钱？" autocomplete="off">
  <button id="send" disabled>发送</button>
</footer>

<!-- 门店信息弹层：南宁一网 13 家，按离客户远近排序 -->
<div class="overlay" id="storeModal">
  <div class="sheet store-sheet">
    <div class="sheet-title">🏪 首驱门店 · 南宁一网</div>
    <div class="store-list" id="st_list"></div>
    <div class="sheet-close" id="st_close">关闭</div>
  </div>
</div>
<!-- 留资弹层 -->
<div class="overlay" id="leadModal">
  <div class="sheet">
    <div class="sheet-title">📱 预约看车 / 留个电话</div>
    <input class="sheet-input" id="lead_phone" type="tel" maxlength="11" placeholder="手机号（我们只用于联系您）">
    <input class="sheet-input" id="lead_model" placeholder="想看的车型（可选）">
    <button class="sheet-btn primary" id="lead_submit">提交，门店会联系您</button>
    <div class="sheet-close" id="lead_close">取消</div>
  </div>
</div>

<script>
(function () {
  var SID_KEY = 'cs_session_id';
  var chat = document.getElementById('chat');
  var input = document.getElementById('input');
  var send = document.getElementById('send');
  var busy = false;

  function getSessionId() {
    var sid = localStorage.getItem(SID_KEY);
    if (!sid) {
      sid = Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
      localStorage.setItem(SID_KEY, sid);
    }
    return sid;
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function nowTime() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  function addMsg(role, text, tools, mapLink) {
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    var av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = role === 'user' ? '👤' : '🛵';
    var body = document.createElement('div');
    body.className = 'body';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    body.appendChild(bubble);
    // 位置问法的回复：直接在聊天气泡下面放高德/腾讯地图链接，点一下跳导航
    if (mapLink) {
      var lk = document.createElement('div');
      lk.className = 'map-links';
      var a1 = document.createElement('a');
      a1.className = 'map-link amap';
      a1.href = mapLink.amap;
      a1.target = '_blank';
      a1.rel = 'noopener';
      a1.textContent = '🗺️ 高德导航';
      var a2 = document.createElement('a');
      a2.className = 'map-link qq';
      a2.href = mapLink.qq;
      a2.target = '_blank';
      a2.rel = 'noopener';
      a2.textContent = '🗺️ 腾讯地图';
      lk.appendChild(a1);
      lk.appendChild(a2);
      body.appendChild(lk);
    }
    if (tools && tools.length) {
      // used_tools 里既有真工具（计算器结果/库存查询结果），也有确定性护栏标记
      // （SHUNT_REFUSE/COMPETITOR_AVAIL/DELIVERY_ANSWER/AFTER_SALES_ANSWER/LOCATION_ANSWER）。
      // 一一对应徽章，别把护栏也标成"查库存"；认不出的标记跳过。
      var MAP = [
        ['计算器', '🧮 算账'],
        ['库存查询', '📦 查库存'],
        ['SHUNT_REFUSE', '🚫 守则拦截'],
        ['COMPETITOR_AVAIL', '🏁 竞品提醒'],
        ['DELIVERY_ANSWER', '🛵 外卖选车'],
        ['AFTER_SALES_ANSWER', '🔧 售后'],
        ['LOCATION_ANSWER', '📍 就近门店']
      ];
      var names = [];
      tools.forEach(function (x) {
        for (var i = 0; i < MAP.length; i++) {
          if (x.indexOf(MAP[i][0]) >= 0) { names.push(MAP[i][1]); return; }
        }
      });
      if (names.length) {
        var t = document.createElement('div');
        t.className = 'tools';
        t.textContent = '（已用工具：' + names.join('、') + '）';
        body.appendChild(t);
      }
    }
    var time = document.createElement('div');
    time.className = 'time';
    time.textContent = nowTime();
    body.appendChild(time);
    wrap.appendChild(av);
    wrap.appendChild(body);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function botTyping(on) {
    var t = document.getElementById('typing');
    if (on) {
      if (!t) {
        t = document.createElement('div');
        t.id = 'typing'; t.className = 'msg bot typing';
        var av = document.createElement('div');
        av.className = 'avatar'; av.textContent = '🛵';
        var body = document.createElement('div');
        body.className = 'body';
        var b = document.createElement('div');
        b.className = 'bubble';
        b.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
        body.appendChild(b);
        t.appendChild(av);
        t.appendChild(body);
        chat.appendChild(t);
      }
    } else if (t) { t.remove(); }
    chat.scrollTop = chat.scrollHeight;
  }

  function ask(q) {
    var dm = detectModel(q);
    if (dm) lastModel = dm;
    busy = true; send.disabled = true;
    addMsg('user', q);
    botTyping(true);
    fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, session_id: getSessionId() })
    }).then(function (r) { return r.json(); }).then(function (d) {
      var a = d.answer || '';
      if (!a) a = '（服务返回异常，请稍后再试）';
      addMsg('bot', a, d.used_tools || [], d.map_link || null);
    }).catch(function () {
      addMsg('bot', '连不上后端。请确认 server.py 正在运行（python server.py）。');
    }).finally(function () {
      botTyping(false); busy = false; send.disabled = false; input.focus();
    });
  }

  send.addEventListener('click', function () {
    var q = input.value.trim();
    if (!q || busy) return;
    input.value = '';
    ask(q);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send.click(); }
  });
  input.addEventListener('input', function () {
    send.disabled = busy || !input.value.trim();
  });

  // 快捷按钮：对比 / 到店 / 预约看车
  var chips = document.querySelector('.chips');
  chips.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn || busy) return;
    var action = btn.getAttribute('data-action');
    if (action === 'store') { openStore(); return; }
    if (action === 'lead') { openLead(); return; }
    var q = btn.getAttribute('data-q');
    if (q) { input.value = ''; ask(q); }
  });

  // —— 门店信息 + 留资（P0：邀约到店 / 抓潜在客户）——
  var store = null;
  var stores = [];
  var lastModel = '';
  function fetchStore(cb) {
    if (store) { cb && cb(); return; }
    fetch('/api/store').then(function (r) { return r.json(); }).then(function (d) {
      store = d.store || {};
      stores = d.stores || [];
      cb && cb();
    }).catch(function () { store = {}; stores = []; cb && cb(); });
  }
  function haversineKm(a, b, c, d) {
    var R = 6371, rad = function (x) { return x * Math.PI / 180; };
    var dl = rad(d - b), dp = rad(c - a);
    var x = Math.sin(dp / 2) * Math.sin(dp / 2) +
      Math.cos(rad(a)) * Math.cos(rad(c)) * Math.sin(dl / 2) * Math.sin(dl / 2);
    return R * 2 * Math.asin(Math.sqrt(x));
  }
  function stRow(s) {
    return '<div class="store-item">' +
      '<div class="st-name">' + (s.name || '首驱门店') +
      (s._dist != null ? ' · 距您 ' + s._dist.toFixed(1) + 'km' : '') + '</div>' +
      '<div class="st-line">📍 ' + (s.address || '') + '</div>' +
      '<div class="st-line">🕘 ' + (s.hours || '每天 9:00-21:00，周末不休') + '</div>' +
      '<div class="st-line">📞 ' + (s.phone || '') + (s.contact ? '（店长 ' + s.contact + '）' : '') + '</div>' +
      '<div class="sheet-btns">' +
      '<button class="sheet-btn primary" data-phone="' + (s.phone || '') + '">📞 拨打电话</button>' +
      '<button class="sheet-btn" data-lat="' + s.lat + '" data-lng="' + s.lng + '" data-name="' + (s.name || '首驱门店') + '">🗺️ 导航</button>' +
      '</div></div>';
  }
  function openStore() {
    fetchStore(function () {
      var list = stores.length ? stores.slice() : [store];
      var render = function () {
        document.getElementById('st_list').innerHTML = list.length
          ? list.map(stRow).join('')
          : '<div class="empty">门店信息还没填，老板去 data/stores.json 填。</div>';
        document.getElementById('storeModal').style.display = 'flex';
      };
      // 有定位就按距离排（最近的在最上面）；拿不到定位就照原顺序
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function (pos) {
          var lat = pos.coords.latitude, lng = pos.coords.longitude;
          list.forEach(function (s) { s._dist = haversineKm(lat, lng, Number(s.lat), Number(s.lng)); });
          list.sort(function (a, b) { return a._dist - b._dist; });
          render();
        }, render);
      } else { render(); }
    });
  }
  function closeStore() { document.getElementById('storeModal').style.display = 'none'; }
  function openLead() {
    document.getElementById('lead_model').value = lastModel;
    document.getElementById('leadModal').style.display = 'flex';
    setTimeout(function () { document.getElementById('lead_phone').focus(); }, 50);
  }
  function closeLead() { document.getElementById('leadModal').style.display = 'none'; }
  function submitLead() {
    var phone = document.getElementById('lead_phone').value.trim();
    if (!/^1\d{10}$/.test(phone)) { alert('手机号要 11 位、1 开头哦'); return; }
    var btn = document.getElementById('lead_submit');
    btn.disabled = true; btn.textContent = '提交中…';
    fetch('/api/lead', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: phone, model: document.getElementById('lead_model').value.trim() })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d.ok) {
        closeLead();
        alert('已登记 ✅ 门店会尽快联系您，也可以直接到店看车！');
      } else { alert(d.error || '提交失败'); }
    }).catch(function () { alert('连不上后端'); })
      .finally(function () { btn.disabled = false; btn.textContent = '提交，门店会联系您'; });
  }
  // 弹层关闭 / 门店列表里的拨号 / 导航（事件委托）
  document.getElementById('st_close').addEventListener('click', closeStore);
  document.getElementById('lead_close').addEventListener('click', closeLead);
  document.getElementById('st_list').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var phone = btn.getAttribute('data-phone');
    if (phone) { location.href = 'tel:' + phone; return; }
    var lat = btn.getAttribute('data-lat'), lng = btn.getAttribute('data-lng');
    if (lat && lng) {
      var url = 'https://uri.amap.com/marker?position=' + lng + ',' + lat +
        '&name=' + encodeURIComponent(btn.getAttribute('data-name') || '首驱门店');
      window.open(url, '_blank');
    }
  });
  document.getElementById('lead_submit').addEventListener('click', submitLead);
  // 点遮罩空白处关闭
  ['storeModal', 'leadModal'].forEach(function (id) {
    document.getElementById(id).addEventListener('click', function (e) {
      if (e.target === this) this.style.display = 'none';
    });
  });
  // 问价时记下车型，留资表单自动预填"想看的车型"
  function detectModel(q) {
    var m = q.match(/首驱\s*([A-Za-z0-9][A-Za-z0-9\- ]*)/);
    if (m && m[1].trim()) return '首驱' + m[1].trim();
    return '';
  }

  input.focus();
})();
</script>
</body>
</html>
