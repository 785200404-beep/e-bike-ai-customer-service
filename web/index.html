<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>首驱电动车智能客服</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #f5f6f7; color: #333; display: flex; flex-direction: column; height: 100%;
  }
  header {
    background: #ff5a1f; color: #fff; padding: 14px 16px; font-size: 17px; font-weight: 600;
    text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.08); flex-shrink: 0;
  }
  header small { display: block; font-size: 11px; font-weight: 400; opacity: .85; margin-top: 2px; }
  #chat { flex: 1; overflow-y: auto; padding: 12px 14px; -webkit-overflow-scrolling: touch; }
  .msg { display: flex; margin-bottom: 12px; }
  .msg .bubble {
    max-width: 82%; padding: 10px 13px; border-radius: 14px; line-height: 1.55;
    font-size: 15px; word-break: break-word; white-space: pre-wrap;
  }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble { background: #ff5a1f; color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot .bubble { background: #fff; color: #333; border-bottom-left-radius: 4px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .msg .tools { font-size: 11px; color: #999; margin-top: 4px; }
  .typing .bubble::after {
    content: "···"; animation: blink 1s infinite; letter-spacing: 2px;
  }
  @keyframes blink { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  .chips {
    flex-shrink: 0; display: flex; gap: 8px; padding: 8px 12px; background: #fff;
    border-top: 1px solid #f0f0f0; overflow-x: auto;
  }
  .chips button {
    flex-shrink: 0; border: 1px solid #ffd5c4; background: #fff7f3; color: #e04e12;
    border-radius: 16px; padding: 6px 13px; font-size: 13px; cursor: pointer;
  }
  .chips button:active { background: #ffe4d8; }
  footer {
    flex-shrink: 0; display: flex; gap: 8px; padding: 10px 12px; background: #fff;
    border-top: 1px solid #eee;
  }
  #input {
    flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 10px 15px; font-size: 15px;
    outline: none; background: #f8f8f8;
  }
  #input:focus { border-color: #ff5a1f; background: #fff; }
  #send {
    border: none; background: #ff5a1f; color: #fff; border-radius: 20px; padding: 0 20px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  #send:disabled { opacity: .5; }
  .welcome { text-align: center; color: #aaa; font-size: 12px; margin: 8px 0 16px; }
</style>
</head>
<body>
<header>首驱电动车店 · 智能客服
  <small>可问价格 · 续航 · 库存 · 算账 · 售后 · 对比竞品</small>
</header>
<div id="chat"><div class="welcome">正在连接客服…</div></div>
<div class="chips">
  <button data-q="雅迪和首驱哪个好？">和雅迪比</button>
  <button data-q="九号和首驱怎么选？">和九号比</button>
  <button data-q="首驱电动车有什么卖点？">首驱卖点</button>
  <button data-q="首驱S300和九号E300P比哪个强？">旗舰对比</button>
</div>
<footer>
  <input id="input" type="text" placeholder="比如：首驱 Sz110 多少钱？" autocomplete="off">
  <button id="send" disabled>发送</button>
</footer>

<script>
(function () {
  var SID_KEY = 'cs_session_id';
  var chat = document.getElementById('chat');
  var input = document.getElementById('input');
  var send = document.getElementById('send');
  var busy = false;

  function getSessionId() {
    var sid = localStorage.getItem(SID_KEY);
    if (!sid) {
      sid = Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
      localStorage.setItem(SID_KEY, sid);
    }
    return sid;
  }

  function addMsg(role, text, tools) {
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);
    if (tools && tools.length) {
      var t = document.createElement('div');
      t.className = 'tools';
      t.textContent = '（已用工具：' + tools.map(function (x) {
        return x.indexOf('计算器') >= 0 ? '🧮 算账' : '📦 查库存';
      }).join('、') + '）';
      wrap.appendChild(t);
    }
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function botTyping(on) {
    var t = document.getElementById('typing');
    if (on) {
      if (!t) {
        t = document.createElement('div');
        t.id = 'typing'; t.className = 'msg bot typing';
        t.innerHTML = '<div class="bubble"></div>';
        chat.appendChild(t);
      }
    } else if (t) { t.remove(); }
    chat.scrollTop = chat.scrollHeight;
  }

  function ask(q) {
    busy = true; send.disabled = true;
    addMsg('user', q);
    botTyping(true);
    fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, session_id: getSessionId() })
    }).then(function (r) { return r.json(); }).then(function (d) {
      var a = d.answer || '';
      if (!a) a = '（服务返回异常，请稍后再试）';
      addMsg('bot', a, d.used_tools || []);
    }).catch(function () {
      addMsg('bot', '连不上后端。请确认 server.py 正在运行（python server.py）。');
    }).finally(function () {
      botTyping(false); busy = false; send.disabled = false; input.focus();
    });
  }

  send.addEventListener('click', function () {
    var q = input.value.trim();
    if (!q || busy) return;
    input.value = '';
    ask(q);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send.click(); }
  });
  input.addEventListener('input', function () {
    send.disabled = busy || !input.value.trim();
  });

  // 快捷对比按钮：点一下直接发问（对比竞品 / 首驱卖点）
  var chips = document.querySelector('.chips');
  chips.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn || busy) return;
    var q = btn.getAttribute('data-q');
    if (q) { input.value = ''; ask(q); }
  });

  // 欢迎语
  var w = document.querySelector('.welcome');
  if (w) w.textContent = '';
  addMsg('bot', '您好，我是首驱电动车店客服。可以问我价格、续航、库存、算账，还能帮您对比雅迪/小牛/九号/极核，比如「首驱和雅迪哪个好？」');
  input.focus();
})();
</script>
</body>
</html>
